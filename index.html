<!DOCTYPE html>
<html lang=zh-CN>
<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width,initial-scale=1,shrink-to-fit=no,viewport-fit=cover,minimum-scale=1,maximum-scale=1,user-scalable=no">
    <title>🎛️调整角度</title>
    <style>
        .box {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center
        }

        .homekit_icon {
            position: absolute;
            width:
                120px;
            height: 34px;
            right: 17px;
            top: 18px;
        }

        .b {
            position: absolute;
            width: 120px;
            height:
                30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            background: rgba(255, 255, 255, 1);

            .minus {
                position: absolute;
                width:
                    18px;
                height: 18px;
                left: 9px;
                cursor: pointer;
                z-index: 9999;
            }

            .plus {
                position: absolute;
                width: 18px;
                height: 18px;
                right: 9px;
                cursor: pointer;
                z-index: 9999;
            }

            .degree {
                position: absolute;
                width: 60px;
                height:
                    21px;
                display: flex;
                flex-direction: row;
                align-items: center;
                color: rgba(68, 68, 68, 1);
                outline: 0;
                border: none;
                font-family: "SF Pro SC", "SF Pro Text", "SF Pro Icons", "PingFangSC", " Helvetica Neue", " Helvetica", " Arial", sans-serif;
                font-style: Medium;
                font-size: 18px;
                font-weight: 500;
                line-height: 21px;
                letter-spacing: -0.41px;
                text-align: center;
                z-index: 500;
            }
        }

        .d {
            position: absolute;
            width: 340px;
            height: 48px;
            border-radius: 12px;
            background: rgba(243, 242,
                    247, 1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            .p {
                position: absolute;
                left: 18px;
                width: 68px;
                height: 19px;
                display: flex;
                flex-direction:
                    column;
                justify-content: center;
                align-items: center;
                color: rgba(68, 68, 68, 1);
                font-family:
                    "SF Pro SC", "SF Pro Text", "SF Pro Icons", "PingFang SC", "Helvetica Neue", "Helvetica",
                    "Arial", sans-serif;
                font-style: Medium;
                font-size: 16px;
                font-weight: 500;
                line-height: 19px;
                letter-spacing: -0.41px;
                text-align: left;
            }
        }

        .button {
            position: absolute;
            width: 340px;
            height: 44px;
            top: 350px;
            border-radius: 10px;
            background: rgb(0, 122, 255);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;

            .text {
                position: absolute;
                width: 296px;
                height: 22px;
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                align-items: center;
                user-select: none;
                color: rgb(255, 255, 255);
                font-family: "SF Pro SC", "SF Pro Text", "SF Pro Icons", "PingFang SC", "Helvetica Neue",
                    "Helvetica", "Arial", sans-serif;
                font-size: 16px;
                font-weight: 600;
                line-height: 22px;
                letter-spacing: -0.41px;
                text-align: center
            }
        }

        .toptext {
            position: absolute;
            width: 310px;
            height: 28px;
            top: 105px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            user-select: none;
            color: #000000;
            font-family: "SF Pro SC", "SF Pro Text",
                "SF Pro Icons", "PingFang SC", "Helvetica Neue", "Helvetica", "Arial", sans-serif;
            font-size:
                20px;
            font-weight: 600;
            line-height: 22px;
            letter-spacing: -0.41px;
            text-align: center
        }

        .error-tip {
            position: absolute;
            color: #ff3b30;
            font-size: 12px;
            top: 42px;
            left:
                20px;
            display: none;
        }
    </style>
    <script>
        // 解析URL参数的工具函数
        function getUrlParam(name) {
            const reg = new RegExp(`(^|&)${name}=([^&]*)(&|$)`);
            const r = window.location.search.substr(1).match(reg);
            return r ? decodeURIComponent(r[2]) : null;
        }

        document.addEventListener('DOMContentLoaded', function () {
            // ========== 1. 解析URL参数，配置表单+填入当前角度 ==========
            const esp32IP = getUrlParam('key');     // ESP32 IP
            const currentOn = getUrlParam('on');   // 当前开启角度
            const currentOff = getUrlParam('off'); // 当前关闭角度
            const form = document.querySelector('form');

            // 设置表单提交地址
            if (esp32IP && form) {
                form.action = `http://${esp32IP}/configure`;
                console.log("表单提交地址：", form.action);
            } else {
                alert("未获取到ESP32 IP，表单无法提交！");
            }

            // 填入当前角度到输入框
            const onInput = document.querySelector('input[name="on"]');
            const offInput = document.querySelector('input[name="off"]');
            if (currentOn) onInput.value = currentOn;  // 开启角度输入框
            if (currentOff) offInput.value = currentOff; // 关闭角度输入框

            // ========== 2. 原有角度交互逻辑（保留） ==========
            const MIN_ANGLE = 0;
            const MAX_ANGLE = 180;

            // 加减按钮逻辑
            document.addEventListener('click', function (e) {
                const btnContainer = e.target.closest('.b');
                if (!btnContainer) return;

                const input = btnContainer.querySelector('.degree');
                if (!input) return;

                let currentValue = Number(input.value) || MIN_ANGLE;
                if (e.target.classList.contains('minus')) {
                    currentValue = Math.max(MIN_ANGLE, currentValue - 1);
                } else if (e.target.classList.contains('plus')) {
                    currentValue = Math.min(MAX_ANGLE, currentValue + 1);
                }
                input.value = currentValue;
                hideErrorTip(input);
            });

            // 输入框校验
            const degreeInputs = document.querySelectorAll('.degree');
            degreeInputs.forEach(input => {
                input.addEventListener('input', function () {
                    this.value = this.value.replace(/[^0-9]/g, '');
                    hideErrorTip(this);
                });
                input.addEventListener('blur', function () {
                    validateAndCorrectAngle(this);
                });
            });

            // 表单提交校验
            form.addEventListener('submit', function (e) {
                let isFormValid = true;
                degreeInputs.forEach(input => {
                    if (!validateAndCorrectAngle(input, true)) {
                        isFormValid = false;
                    }
                });
                if (!isFormValid) {
                    e.preventDefault();
                    alert('请输入0-180之间的有效角度数值');
                }
            });

            // 工具函数
            function validateAndCorrectAngle(input, showTip = false) {
                let value = Number(input.value) || MIN_ANGLE;
                if (value < MIN_ANGLE) {
                    value = MIN_ANGLE;
                    showTip && showErrorTip(input, '角度不能小于0');
                } else if (value > MAX_ANGLE) {
                    value = MAX_ANGLE;
                    showTip && showErrorTip(input, '角度不能大于180');
                } else {
                    hideErrorTip(input);
                    return true;
                }
                input.value = value;
                return !showTip;
            }

            function showErrorTip(input, text) {
                let tip = input.closest('.d').querySelector('.error-tip');
                if (!tip) {
                    tip = document.createElement('div');
                    tip.className = 'error-tip';
                    input.closest('.d').appendChild(tip);
                }
                tip.textContent = text;
                tip.style.display = 'block';
            }

            function hideErrorTip(input) {
                const tip = input.closest('.d').querySelector('.error-tip');
                if (tip) tip.style.display = 'none';
            }
        });
    </script>
</head>
<body class="box">
    <img class="homekit_icon" src="https://creation.bcmcdn.com/716/appcraft/IMAGE_ehkk8kr4H_1770536778306.svg">
    <div class="toptext">调整开关角度🎛️</div>

    <form class="box" action="/configure" method="get">
        <div class="d" style="top: 189px;">
            <div class="p">开启角度</div>
            <div class="b" style="right: 11px;">
                <img src="https://creation.bcmcdn.com/716/appcraft/IMAGE_kEoOh6Bb-a_1770536778306.svg" class="minus">
                <img src="https://creation.bcmcdn.com/716/appcraft/IMAGE_iRQvlkhQsT_1770536778307.svg" class="plus">
                <input name="on" placeholder="0" required maxlength="3" class="degree" type="text">
            </div>
        </div>
        <div class="d" style="top: 254px;">
            <div class="p">关闭角度</div>
            <div class="b" style="right: 11px;">
                <img src="https://creation.bcmcdn.com/716/appcraft/IMAGE_kEoOh6Bb-a_1770536778306.svg" class="minus">
                <img src="https://creation.bcmcdn.com/716/appcraft/IMAGE_iRQvlkhQsT_1770536778307.svg" class="plus">
                <input name="off" placeholder="0" required maxlength="3" class="degree" type="text">
            </div>
        </div>
        <div onclick="document.getElementById('lick1').click()" class="button">
            <div class="text">就这样😊</div>
        </div>
        <input type="submit" id="lick1" style="display: none">
    </form>
</body>
</html>

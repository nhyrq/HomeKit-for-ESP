<!DOCTYPE html>
<html lang=zh-CN>

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width,initial-scale=1,shrink-to-fit=no,viewport-fit=cover,minimum-scale=1,maximum-scale=1,user-scalable=no">
    <title>调整角度</title>
    <style>
        .box {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center
        }

        .homekit_icon {
            position: absolute;
            width:
                120px;
            height: 34px;
            right: 17px;
            top: 18px;
        }

        .b {
            position: absolute;
            width: 120px;
            height:
                30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            background: rgba(255, 255, 255, 1);

            .minus {
                position: absolute;
                width:
                    18px;
                height: 18px;
                left: 9px;
                cursor: pointer;
                z-index: 9999;
            }

            .plus {
                position: absolute;
                width: 18px;
                height: 18px;
                right: 9px;
                cursor: pointer;
                z-index: 9999;
            }

            .degree {
                position: absolute;
                width: 60px;
                height:
                    21px;
                display: flex;
                flex-direction: row;
                align-items: center;
                color: rgba(68, 68, 68, 1);
                outline: 0;
                border: none;
                font-family: "SF Pro SC", "SF Pro Text", "SF Pro Icons", "PingFangSC", " Helvetica Neue", " Helvetica", " Arial", sans-serif;
                font-style: Medium;
                font-size: 18px;
                font-weight: 500;
                line-height: 21px;
                letter-spacing: -0.41px;
                text-align: center;
                z-index: 500;
            }
        }

        .d {
            position: absolute;
            width: 340px;
            height: 48px;
            border-radius: 12px;
            background: rgba(243, 242,
                    247, 1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            .p {
                position: absolute;
                left: 18px;
                width: 68px;
                height: 19px;
                display: flex;
                flex-direction:
                    column;
                justify-content: center;
                align-items: center;
                color: rgba(68, 68, 68, 1);
                font-family:
                    "SF Pro SC", "SF Pro Text", "SF Pro Icons", "PingFang SC", "Helvetica Neue", "Helvetica",
                    "Arial", sans-serif;
                font-style: Medium;
                font-size: 16px;
                font-weight: 500;
                line-height: 19px;
                letter-spacing: -0.41px;
                text-align: left;
            }
        }

        .button {
            position: absolute;
            width: 340px;
            height: 44px;
            top: 350px;
            border-radius: 10px;
            background: rgb(0, 122, 255);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;

            .text {
                position: absolute;
                width: 296px;
                height: 22px;
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                align-items: center;
                user-select: none;
                color: rgb(255, 255, 255);
                font-family: "SF Pro SC", "SF Pro Text", "SF Pro Icons", "PingFang SC", "Helvetica Neue",
                    "Helvetica", "Arial", sans-serif;
                font-size: 16px;
                font-weight: 600;
                line-height: 22px;
                letter-spacing: -0.41px;
                text-align: center
            }
        }

        .toptext {
            position: absolute;
            width: 310px;
            height: 28px;
            top: 105px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            user-select: none;
            color: #000000;
            font-family: "SF Pro SC", "SF Pro Text",
                "SF Pro Icons", "PingFang SC", "Helvetica Neue", "Helvetica", "Arial", sans-serif;
            font-size:
                20px;
            font-weight: 600;
            line-height: 22px;
            letter-spacing: -0.41px;
            text-align: center
        }

        /* 新增：错误提示样式 */
        .error-tip {
            position: absolute;
            color: #ff3b30;
            font-size: 12px;
            top: 42px;
            left:
                20px;
            display: none;
        }
    </style>
    <script>
        // 新增：解析URL参数的工具函数（核心修改）
        function getUrlParam(name) {
            const reg = new RegExp(`(^|&)${name}=([^&]*)(&|$)`);
            const r = window.location.search.substr(1).match(reg);
            return r ? decodeURIComponent(r[2]) : null;
        }

        // 等待DOM元素完全加载后执行
        document.addEventListener('DOMContentLoaded', function () {
            // ========== 新增核心逻辑：动态修改表单提交地址（核心修改） ==========
            const esp32IP = getUrlParam('key'); // 从URL获取ESP32的IP（key参数）
            const form = document.querySelector('form');
            if (esp32IP && form) {
                // 将表单提交地址改为：http://ESP32_IP/configure
                form.action = `http://${esp32IP}/configure`;
                console.log("表单提交地址已设置为：", form.action);
            } else {
                alert("未获取到ESP32 IP，表单无法提交！请确保从ESP32的IP地址跳转过来");
            }

            // 定义角度范围常量
            const MIN_ANGLE = 0;
            const MAX_ANGLE = 180;

            // ========== 1. 加减按钮逻辑 ==========
            document.addEventListener('click', function (e) {
                const btnContainer = e.target.closest('.b');
                if (!btnContainer) return;

                const input = btnContainer.querySelector('.degree');
                if (!input) return;

                let currentValue = Number(input.value) || MIN_ANGLE;

                if (e.target.classList.contains('minus')) {
                    // 减1，不低于最小值0
                    currentValue = Math.max(MIN_ANGLE, currentValue - 1);
                } else if (e.target.classList.contains('plus')) {
                    // 加1，不高于最大值180
                    currentValue = Math.min(MAX_ANGLE, currentValue + 1);
                }

                input.value = currentValue;
                // 清除可能的错误提示
                hideErrorTip(input);
            });

            // ========== 2. 输入框实时校验（只允许数字） ==========
            const degreeInputs = document.querySelectorAll('.degree');
            degreeInputs.forEach(input => {
                // 实时输入过滤：只保留数字
                input.addEventListener('input', function () {
                    // 移除所有非数字字符
                    this.value = this.value.replace(/[^0-9]/g, '');
                    hideErrorTip(input);
                });

                // 失焦时校正数值（超出范围自动修正）
                input.addEventListener('blur', function () {
                    validateAndCorrectAngle(this);
                });
            });

            // ========== 3. 表单提交前最终校验 ==========
            const formElement = document.querySelector('form');
            formElement.addEventListener('submit', function (e) {
                let isFormValid = true;

                // 校验所有角度输入框
                degreeInputs.forEach(input => {
                    if (!validateAndCorrectAngle(input, true)) {
                        isFormValid = false;
                    }
                });

                // 校验不通过则阻止提交
                if (!isFormValid) {
                    e.preventDefault();
                    alert('请输入0-180之间的有效角度数值');
                }
            });

            // ========== 工具函数 ==========
            /**
             * 校验并校正角度数值
             * @param {HTMLInputElement} input - 输入框元素
             * @param {boolean} showTip - 是否显示错误提示
             * @returns {boolean} 是否校验通过
             */
            function validateAndCorrectAngle(input, showTip = false) {
                let value = Number(input.value) || MIN_ANGLE;

                // 超出范围则自动修正
                if (value < MIN_ANGLE) {
                    value = MIN_ANGLE;
                    showTip && showErrorTip(input, '角度不能小于0');
                } else if (value > MAX_ANGLE) {
                    value = MAX_ANGLE;
                    showTip && showErrorTip(input, '角度不能大于180');
                } else {
                    hideErrorTip(input);
                    return true;
                }

                input.value = value;
                return !showTip; // 自动修正后，非强制提示场景视为有效
            }

            /**
             * 显示错误提示
             * @param {HTMLInputElement} input - 输入框元素
             * @param {string} text - 提示文本
             */
            function showErrorTip(input, text) {
                // 查找或创建错误提示元素
                let tip = input.closest('.d').querySelector('.error-tip');
                if (!tip) {
                    tip = document.createElement('div');
                    tip.className = 'error-tip';
                    input.closest('.d').appendChild(tip);
                }
                tip.textContent = text;
                tip.style.display = 'block';
            }

            /**
             * 隐藏错误提示
             * @param {HTMLInputElement} input - 输入框元素
             */
            function hideErrorTip(input) {
                const tip = input.closest('.d').querySelector('.error-tip');
                if (tip) {
                    tip.style.display = 'none';
                }
            }
        });
    </script>
</head>

<body class="box">
    <img class="homekit_icon" src="https://creation.bcmcdn.com/716/appcraft/IMAGE_ehkk8kr4H_1770536778306.svg">
    <div class="toptext">调整开关角度</div>

    <!-- 核心改动：method从get改为post -->
    <form class="box" action="/configure" method="post">
        <div class="d" style="top: 189px;">
            <div class="p">开启角度</div>
            <div class="b" style="right: 11px;">
                <img src="https://creation.bcmcdn.com/716/appcraft/IMAGE_kEoOh6Bb-a_1770536778306.svg" class="minus">
                <img src="https://creation.bcmcdn.com/716/appcraft/IMAGE_iRQvlkhQsT_1770536778307.svg" class="plus">
                <input name="on" placeholder="0" required maxlength="3" class="degree" type="text">
            </div>
        </div>
        <div class="d" style="top: 254px;">
            <div class="p">关闭角度</div>
            <div class="b" style="right: 11px;">
                <img src="https://creation.bcmcdn.com/716/appcraft/IMAGE_kEoOh6Bb-a_1770536778306.svg" class="minus">
                <img src="https://creation.bcmcdn.com/716/appcraft/IMAGE_iRQvlkhQsT_1770536778307.svg" class="plus">
                <input name="off" placeholder="0" required maxlength="3" class="degree" type="text">
            </div>
        </div>
        <div onclick="document.getElementById('lick1').click()" class="button">
            <div class="text">就这样</div>
        </div>
        <input type="submit" id="lick1" style="display: none">
    </form>
</body>

</html>
